# Verification checklist for ai_test2 (independent repo, ../ai_test2).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation.
#
# This repo has NO repo-wide CI or aggregate runner (confirmed: no
# .github/workflows/, no root .ps1/.py verify script). VERIFICATION.md
# documents concrete per-subproject commands under "Required Commands" — real
# and copy-pasteable, but a manually-run log, not an enforced gate (the file
# itself says not to treat its dated history sections as current). The
# commands below are taken verbatim from that file.

project: ai_test2
repo_root: ai_test2
updated: 2026-09-18
release_review:
  release: "32bcc67 (공개 출시 검토 기준점)"
  audience: "전세계 사용자 (프로젝트별 세부 역할 미확정)"
  distribution: "GitHub 소스코드 무료 공개 검토"
  jurisdictions: ["전세계"]
  areas:
    functional_suitability: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#기능-적합성"}
    performance_efficiency: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#성능-효율성"}
    compatibility: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#호환성"}
    interaction_capability: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#상호작용-능력"}
    reliability: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#신뢰성"}
    security: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#보안"}
    maintainability: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#유지보수성"}
    portability: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#유연성-이식성"}
    safety: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#안전성"}
    quality_in_use: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#실사용-품질"}
    privacy: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#개인정보-데이터-거버넌스"}
    supply_chain: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#공급망-라이선스"}
    operations: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#배포-운영"}
    legal: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#법률-규제"}
    commercial: {decision: pending, evidence: "projects/ai_test2/RELEASE_REVIEW.md#사업-운영"}

requirements:
  - id: R1
    quality_dimension: functional_suitability
    description: "이 저장소는 여러 개별 프로그램의 모음이라 전체를 한 번에 검사하는 도구가 없다. 그래서 각 프로그램이 자기 자신의 테스트를 개별적으로 통과해야 한다 (검사 방법은 저장소 안 VERIFICATION.md 문서에 정리되어 있음)"
    dev_items:
      - id: R1-D1
        description: "ai_anime — 애니메이션 관련 이미지/영상 생성 프로그램"
        test_items:
          - id: ai-anime-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd ai_anime && python -m pytest tests_unit.py -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D2
        description: "ai_img_video_aiBoygirl — 캐릭터(남녀) 이미지·영상을 생성하는 프로그램"
        test_items:
          - id: ai-img-video-aiboygirl-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd ai_img_video_aiBoygirl && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D3
        description: "ai_img_video_prompt_capcut — 이미지·영상 생성용 문구(프롬프트)를 캡컷 편집 형식으로 만드는 프로그램"
        test_items:
          - id: ai-img-video-prompt-capcut-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd ai_img_video_prompt_capcut && python -m pytest tests_unit.py -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D5
        description: "youtube_research — 유튜브 콘텐츠를 조사·분석하는 프로그램"
        test_items:
          - id: youtube-research-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd youtube_research && python -m pytest tests_unit.py -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D6
        description: "music_insight_studio — 음악 데이터를 분석하는 프로그램 (다른 프로그램들과 달리 자체 실행 환경이 별도로 필요함)"
        test_items:
          - id: music-insight-studio-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd music_insight_studio && .venv\\Scripts\\python.exe -m unittest discover -s tests"
            status: pass
            last_verified: 2026-08-05
      # CareerDiff moved here from ai_test3 on 2026-09-06 (see ai_test3/README.md).
      # ai_test3's checklist.yaml entry pointed at the old, now-nonexistent
      # `ai_test3/CareerDiff` path and was retired from this registry on
      # 2026-09-07 when this gap was found. Commands are the exact npm
      # scripts in CareerDiff/app/package.json. Deliberately not included:
      # `test:e2e` (Playwright, runs against a production build + started
      # server -- heavier and can hang a live checklist run) -- run it by
      # hand per CareerDiff/docs/VERIFICATION.md when needed.
      - id: R1-D7
        description: "CareerDiff — 채용공고와 이력서를 비교해 적합도를 분석해주는 웹서비스, 코드 타입 오류 검사"
        test_items:
          - id: careerdiff-typecheck
            category: basic
            description: "코드 안에서 값의 종류를 잘못 사용한 곳이 없는지 확인합니다."
            check: "cd CareerDiff\\app && npm run typecheck"
            status: pass
            last_verified: 2026-09-07
      - id: R1-D8
        description: "CareerDiff — 코드 품질 검사(린트)"
        test_items:
          - id: careerdiff-lint
            category: basic
            description: "알려진 나쁜 코드 패턴이 없는지 확인합니다."
            check: "cd CareerDiff\\app && npm run lint"
            status: pass
            last_verified: 2026-09-07
      - id: R1-D9
        description: "CareerDiff — 기능별 자체 테스트(적합도 분석, 이력서 불러오기 등 핵심 기능)"
        test_items:
          - id: careerdiff-unit-tests
            category: basic
            description: "적합도 분석, 이력서 불러오기 등 핵심 기능이 예상대로 동작하는지 확인합니다."
            check: "cd CareerDiff\\app && npm test"
            status: pass
            last_verified: 2026-09-07
      - id: R1-D10
        description: "CareerDiff — 실서비스용 빌드"
        test_items:
          - id: careerdiff-build
            category: full
            description: "실제 서비스에 배포 가능한 형태로 프로그램이 오류 없이 만들어지는지 확인합니다."
            check: "cd CareerDiff\\app && npm run build"
            status: pass
            last_verified: 2026-09-07

  - id: R2
    quality_dimension: security
    description: "커밋되는 소스 코드에 OWASP/CWE 근거 기반 보안·해킹·네트워크 허점이 미검토 상태로 남으면 안 된다"
    dev_items:
      - id: R2-D1
        description: "정적 패턴 스캐너(qa_manager SECURITY_NETWORK_QA_STANDARD.md 이식, ai_test와 동일)"
        test_items:
          - id: security-hotspots-guard
            category: basic
            description: "소스 파일에 CWE 매핑된 위험 패턴이 qa:allow 근거 주석 없이 남아있지 않은지 확인합니다. CareerDiff의 non-https 거부 검증용 테스트 입력 2건은 qa:allow로 처리했습니다."
            check: "python scripts/check_security_hotspots.py"
            status: pass
            last_verified: 2026-09-18
          - id: security-hotspots-guard-regression
            category: regression
            description: "규칙별 실탐/오탐 및 스캐너 자기제외가 의도대로 동작하는지 확인합니다."
            check: "python -m pytest tests/test_security_hotspots.py -q"
            status: pass
            last_verified: 2026-09-18
