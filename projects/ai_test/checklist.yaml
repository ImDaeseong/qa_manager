# Verification checklist for ai_test (independent repo, C:\Users\cs930\Desktop\ai_test).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation.
#
# This repo has NO repo-wide CI or aggregate test runner (confirmed: no
# .github/workflows/, no root pytest.ini/pyproject.toml/Makefile — verified
# by direct investigation, not assumed). Verification is per-subproject only.
# The dev_items below list every subdirectory found to have a real, runnable
# test suite (conftest.py/pytest.ini + actual test files) at investigation
# time; subdirectories without test artifacts (Doc, extensions, run_game,
# node-only projects with no test dir, Go projects using `go test` instead of
# pytest) are intentionally not listed rather than inventing a check for them.
# No lint/type-check config exists anywhere in this repo either.

