# Verification checklist for ai_test (independent repo, ../ai_test).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation.
#
# This repo has NO repo-wide CI or aggregate test runner (confirmed: no
# .github/workflows/, no root pytest.ini/pyproject.toml/Makefile — verified
# by direct investigation, not assumed). Verification is per-subproject only.
# The dev_items below list every subdirectory found to have a real, runnable
# test suite (conftest.py/pytest.ini + actual test files) at investigation
# time; subdirectories without test artifacts (Doc, extensions, run_game,
# node-only projects with no test dir, Go projects using `go test` instead of
# pytest) are intentionally not listed rather than inventing a check for them.
# No lint/type-check config exists anywhere in this repo either.

project: ai_test
repo_root: ai_test
updated: 2026-09-21
release_review:
  release: "7afa58c (MIT 소스 전용 공개 출시 검토 기준점)"
  audience: "전세계 사용자 (프로젝트별 세부 역할 미확정)"
  distribution: "GitHub 소스코드 무료 공개 검토; 미디어·실행 파일 제외"
  jurisdictions: ["전세계"]
  areas:
    functional_suitability: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#기능-적합성"}
    performance_efficiency: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#성능-효율성"}
    compatibility: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#호환성"}
    interaction_capability: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#상호작용-능력"}
    reliability: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#신뢰성"}
    security: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#보안"}
    maintainability: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#유지보수성"}
    portability: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#유연성-이식성"}
    safety: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#안전성"}
    quality_in_use: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#실사용-품질"}
    privacy: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#개인정보-데이터-거버넌스"}
    supply_chain: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#공급망-라이선스"}
    operations: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#배포-운영"}
    legal: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#법률-규제"}
    commercial: {decision: pending, evidence: "projects/ai_test/RELEASE_REVIEW.md#사업-운영"}

requirements:
  - id: R1
    quality_dimension: functional_suitability
    description: "이 저장소는 여러 개별 프로그램의 모음이라 전체를 한 번에 검사하는 도구가 없다. 그래서 각 프로그램이 자기 자신의 테스트를 개별적으로 통과해야 한다"
    dev_items:
      - id: R1-D1
        description: "Analysis_music — 음악 데이터를 분석하는 프로그램"
        test_items:
          - id: analysis-music-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd Analysis_music && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D2
        description: "Pexels — 무료 이미지/영상 소스(Pexels)에서 소재를 가져오는 프로그램"
        test_items:
          - id: pexels-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd Pexels && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D3
        description: "ai-webtoon — 웹툰 관련 자동화 프로그램"
        test_items:
          - id: ai-webtoon-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd ai-webtoon && python -m pytest tests_unit.py -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D4
        description: "ai-webtoon_capcut — 웹툰 영상을 캡컷(CapCut) 편집 형식으로 변환하는 프로그램"
        test_items:
          - id: ai-webtoon-capcut-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd ai-webtoon_capcut && powershell.exe -NoProfile -File scripts\\test.ps1"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D5
        description: "findstring_foldfiles — 파일에서 문자열을 찾고 폴더를 정리하는 프로그램"
        test_items:
          - id: findstring-foldfiles-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd findstring_foldfiles && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D6
        description: "lyrics_tag — 음원 파일에 가사 정보를 입력하는 프로그램"
        test_items:
          - id: lyrics-tag-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd lyrics_tag && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D7
        description: "master_tag — 음원 마스터링 파일에 태그 정보를 입력하는 프로그램"
        test_items:
          - id: master-tag-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd master_tag && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D8
        description: "mp4_tag — mp4 영상 파일에 태그 정보를 입력하는 프로그램"
        test_items:
          - id: mp4-tag-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd mp4_tag && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D9
        description: "security_scanning — 보안 취약점을 점검하는 프로그램"
        test_items:
          - id: security-scanning-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd security_scanning && python -m pytest -q"
            status: pass
            last_verified: 2026-08-05
      - id: R1-D10
        description: "weather_alarm — 날씨 정보를 받아 알림을 보내는 프로그램"
        test_items:
          # 2026-09-07: 검증 계정(샌드박스)의 ACL이 일반 사용자 계정과 달라
          # OS 기본 temp(%LOCALAPPDATA%\Temp\pytest-of-*)에 계정별로 접근이
          # 막힐 수 있음이 재확인됨 -- 특정 계정의 ACL을 개별적으로 고치는
          # 대신, 검증 명령 자체가 프로젝트 로컬 temp를 쓰도록 고정해 어떤
          # 계정에서 실행되든 OS temp ACL에 의존하지 않게 함(코드 결함 아님).
          - id: weather-alarm-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 모두 정상적으로 통과하는지 확인합니다."
            check: "cd weather_alarm && python -m pytest -q --basetemp .pytest_tmp"
            status: pass
            last_verified: 2026-09-07
      - id: R1-D11
        description: "windows-port-monitor — 윈도우 PC의 네트워크 포트 사용 현황을 감시하는 프로그램"
        test_items:
          - id: windows-port-monitor-tests
            category: basic
            description: "이 프로그램에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd windows-port-monitor && python -m pytest tests/ -q"
            status: pass
            last_verified: 2026-08-05

  - id: R2
    quality_dimension: security
    description: "커밋되는 소스 코드에 OWASP/CWE 근거 기반 보안·해킹·네트워크 허점이 미검토 상태로 남으면 안 된다"
    dev_items:
      - id: R2-D1
        description: "정적 패턴 스캐너(qa_manager SECURITY_NETWORK_QA_STANDARD.md 이식) — 저장소 전체(195개 소스파일) 대상"
        test_items:
          - id: security-hotspots-guard
            category: basic
            description: "소스 파일에 CWE 매핑된 위험 패턴이 qa:allow 근거 주석 없이 남아있지 않은지 확인합니다. weather_alarm의 data.go.kr http 엔드포인트는 https 지원 확인 후 코드로 수정, 나머지 4건(테스트 픽스처·서술형 문자열·PRAGMA)은 qa:allow 처리했습니다."
            check: "python scripts/check_security_hotspots.py"
            status: pass
            last_verified: 2026-09-18
          - id: security-hotspots-guard-regression
            category: regression
            description: "규칙별 실탐/오탐(JS .exec(), example.com/w3.org 제외 포함) 및 스캐너 자기제외가 의도대로 동작하는지 확인합니다."
            check: "python -m pytest tests/test_security_hotspots.py -q"
            status: pass
            last_verified: 2026-09-18

  - id: R3
    quality_dimension: supply_chain
    description: "소스 전용 배포 범위, 루트 MIT 범위, 포함된 JsonCpp 1.7.2 고지문을 자동 검사한다"
    dev_items:
      - id: R3-D1
        description: "미디어·실행 파일이 Git 추적 목록에 남지 않도록 확인한다"
        test_items:
          - id: source-only-guard
            category: basic
            description: "Git 인덱스의 미디어·실행 파일 수가 0인지 확인합니다."
            check: "python scripts/check_source_only.py"
            status: pass
            last_verified: 2026-09-21
      - id: R3-D2
        description: "포함된 JsonCpp 버전의 원본 라이선스 고지문을 유지한다"
        test_items:
          - id: jsoncpp-license-guard
            category: regression
            description: "JsonCpp 1.7.2 LICENSE가 추적되고 원본 내용과 일치하는지 확인합니다."
            check: "python scripts/check_vendor_notices.py"
            status: pass
            last_verified: 2026-09-21
      - id: R3-D3
        description: "직접 작성 코드의 MIT와 제3자 라이선스 경계를 유지한다"
        test_items:
          - id: root-license-guard
            category: basic
            description: "루트 MIT 원문, 제3자 고지, README 링크와 Git 추적 상태를 확인합니다."
            check: "python scripts/check_license_scope.py"
            status: pass
            last_verified: 2026-09-21
          - id: root-license-guard-regression
            category: regression
            description: "라이선스 변조·무관 누락·CRLF 차이를 구분하는 가드 회귀 테스트입니다."
            check: "python -m pytest tests/test_license_scope.py -q"
            status: pass
            last_verified: 2026-09-21
      - id: R3-D4
        description: "추적 중인 의존성 manifest와 lockfile 검토 근거를 최신 상태로 유지한다"
        test_items:
          - id: dependency-inventory-guard
            category: basic
            description: "모든 추적 manifest가 인벤토리에 기록되고 해시가 일치하며 npm lock 형식이 지원되는지 확인합니다."
            check: "python scripts/check_dependency_inventory.py"
            status: pass
            last_verified: 2026-09-21
          - id: dependency-inventory-guard-regression
            category: regression
            description: "누락·잔존·변경 manifest와 누락·손상·구형 npm lock을 가드가 거부하는지 확인합니다."
            check: "python -m pytest tests/test_dependency_inventory.py -q --basetemp .pytest_dependency_inventory"
            status: pass
            last_verified: 2026-09-21
