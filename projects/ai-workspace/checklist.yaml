# Verification checklist for ai-workspace (independent repo, nested at
# hermes-agents/ai-workspace on this machine but unrelated to hermes-agents).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation.
#
# Every item below is taken directly from .github/workflows/validate.yml and
# the scripts/*.py|ps1 it calls (confirmed by reading them, not guessed).

project: ai-workspace
repo_root: hermes-agents/ai-workspace
updated: 2026-08-05

requirements:
  - id: R1
    description: "HANDOFF.md가 Progress Gates 증거 없이 100%로 건너뛰거나, 요약 없이 전체 이력으로 비대해지면 안 된다"
    dev_items:
      - id: R1-D1
        description: "check_handoff_hygiene.py --both (staged + working-tree HANDOFF.md 검사)"
        test_items:
          - id: handoff-hygiene-guard
            category: basic
            description: "HANDOFF.md's newest dated entry doesn't collapse straight to 100% without 20/40/60/80/90 gate evidence, and the file stays current-state (not a full transcript)"
            check: "python scripts/check_handoff_hygiene.py --both"
            status: pass
            last_verified: 2026-08-05

  - id: R2
    description: "마크다운 문서 내부 링크가 깨지지 않아야 한다"
    dev_items:
      - id: R2-D1
        description: "validate_links.ps1"
        test_items:
          - id: validate-links-guard
            category: basic
            description: "local markdown links resolve to existing files repo-wide"
            check: "powershell.exe -NoProfile -File scripts/validate_links.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R3
    description: "HANDOFF hygiene 검사기 자체의 로직에 회귀가 없어야 한다"
    dev_items:
      - id: R3-D1
        description: "test_check_handoff_hygiene.py"
        test_items:
          - id: handoff-hygiene-unit-tests
            category: regression
            description: "unit tests for check_handoff_hygiene.py's own detection logic"
            check: "python scripts/test_check_handoff_hygiene.py"
            status: pass
            last_verified: 2026-08-05

  - id: R4
    description: "위 가드들이 통합 실행 시에도 함께 통과하고, 검증 과정 자체가 부작용을 남기지 않아야 한다"
    dev_items:
      - id: R4-D1
        description: "verify_repo.ps1 오케스트레이터 (하위 가드 체인 + 실행 전후 git status 동일성 검사)"
        test_items:
          - id: verify-repo-full
            category: full
            description: "verify_repo.ps1 runs check_handoff_hygiene.py + validate_links.ps1 in order and asserts `git status --porcelain` is unchanged before/after (run without -BaseRef, so the base-ref diff hygiene check is skipped)"
            check: "powershell.exe -NoProfile -File scripts/verify_repo.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R5
    description: "CI 부작용 감지 메커니즘(실행 전후 git status 비교) 자체가 실제로 동작해야 한다"
    dev_items:
      - id: R5-D1
        description: "verify_repo.ps1 -SideEffectSelfTest — 임시 저장소에서 의도적으로 파일을 만들어 감지되는지 자가검사"
        test_items:
          - id: verify-repo-side-effect-selftest
            category: regression
            description: "the before/after git-status diffing mechanism inside verify_repo.ps1 actually detects a newly created untracked file"
            check: "powershell.exe -NoProfile -File scripts/verify_repo.ps1 -SideEffectSelfTest"
            status: pass
            last_verified: 2026-08-05
