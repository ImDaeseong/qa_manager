# Verification checklist for ai-workspace (independent repo, nested at
# hermes-agents/ai-workspace on this machine but unrelated to hermes-agents).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation.
#
# Every item below is taken directly from .github/workflows/validate.yml and
# the scripts/*.py|ps1 it calls (confirmed by reading them, not guessed).

project: ai-workspace
repo_root: hermes-agents/ai-workspace
updated: 2026-08-05

requirements:
  - id: R1
    description: "작업 인계 문서(HANDOFF.md)가 근거 없이 '완료(100%)'로 표시되거나, 요약 없이 지나치게 길어지면 안 된다"
    dev_items:
      - id: R1-D1
        description: "작업 인계 문서 점검 — 새로 커밋되는 내용과 현재 파일 상태를 함께 확인"
        test_items:
          - id: handoff-hygiene-guard
            category: basic
            description: "가장 최근에 기록된 작업 항목이 단계별 근거 없이 곧바로 '완료'로 표시되지 않았는지, 그리고 문서가 전체 이력을 나열하는 대신 현재 상태 위주로 유지되는지 확인합니다."
            check: "python scripts/check_handoff_hygiene.py --both"
            status: pass
            last_verified: 2026-08-05

  - id: R2
    description: "문서 안의 내부 링크가 깨지지 않아야 한다"
    dev_items:
      - id: R2-D1
        description: "문서 내부 링크 검사"
        test_items:
          - id: validate-links-guard
            category: basic
            description: "문서 안에 있는 다른 문서로의 링크가 실제로 존재하는 파일을 가리키는지 저장소 전체에서 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/validate_links.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R3
    description: "작업 인계 문서를 점검하는 도구 자체에 오류가 재발하면 안 된다"
    dev_items:
      - id: R3-D1
        description: "점검 도구 자체 검사"
        test_items:
          - id: handoff-hygiene-unit-tests
            category: regression
            description: "작업 인계 문서를 점검하는 도구가 스스로 올바르게 판단하는지 확인하는 자체 테스트입니다."
            check: "python scripts/test_check_handoff_hygiene.py"
            status: pass
            last_verified: 2026-08-05

  - id: R4
    description: "전체 자동 검사를 한꺼번에 실행해도 문제없이 통과해야 하고, 검사 과정 자체가 실수로 파일을 바꾸면 안 된다"
    dev_items:
      - id: R4-D1
        description: "통합 검사 실행기 — 위 R1, R2의 검사를 순서대로 실행하고, 검사 전후로 파일이 바뀌지 않았는지 확인"
        test_items:
          - id: verify-repo-full
            category: full
            description: "작업 인계 문서 점검과 링크 검사를 순서대로 실행하고, 실행 전후로 저장소 파일이 의도치 않게 바뀌지 않았는지 함께 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/verify_repo.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R5
    description: "검사 과정에서 파일이 실수로 바뀌었는지 감지하는 안전장치 자체가 실제로 작동해야 한다"
    dev_items:
      - id: R5-D1
        description: "안전장치 자가 점검 — 임시 저장소에 일부러 파일을 하나 만들어서, 그걸 실제로 잡아내는지 확인"
        test_items:
          - id: verify-repo-side-effect-selftest
            category: regression
            description: "검사 전후 파일 변경을 감지하는 안전장치가, 실제로 새 파일이 생기면 그걸 놓치지 않고 잡아내는지 자체 점검합니다."
            check: "powershell.exe -NoProfile -File scripts/verify_repo.ps1 -SideEffectSelfTest"
            status: pass
            last_verified: 2026-08-05

  # Added 2026-09-14 as part of raising this project toward AGENTS.md's
  # Commercial-Grade Baseline rule (OWASP ASVS Level 1: no secrets in
  # tracked files). This repo stores business strategy/personal-goal
  # content, so exposure risk is at least as high as hermes-agents itself.
  - id: R6
    description: "커밋되는 파일에 실제로 사용 가능한 비밀정보(API 키, 토큰)가 들어가면 안 된다"
    dev_items:
      - id: R6-D1
        description: "비밀정보처럼 보이는 값 패턴 검사 — hermes-agents의 동일 가드를 이식"
        test_items:
          - id: no-example-secrets-guard
            category: basic
            description: "저장소에 올라가는 파일에 실제로 사용 가능한 비밀번호나 인증키가 실수로 포함되지 않았는지 확인합니다."
            check: "python scripts/check_no_example_secrets.py"
            status: pass
            last_verified: 2026-09-14
      - id: R6-D2
        description: "패턴 목록이 실제로 심어둔 가짜 비밀키를 잡아내고, 평범한 문장에는 반응하지 않는지 검사"
        test_items:
          - id: no-example-secrets-guard-regression
            category: regression
            description: "비밀정보 탐지 패턴이 실제 가짜 비밀키 형태를 놓치지 않고, 평범한 텍스트를 오탐하지 않는지 확인합니다."
            check: "python scripts/test_check_no_example_secrets.py"
            status: pass
            last_verified: 2026-09-14

  - id: R7
    description: "커밋되는 소스 코드에 OWASP/CWE 근거 기반 보안·해킹·네트워크 허점이 미검토 상태로 남으면 안 된다"
    dev_items:
      - id: R7-D1
        description: "정적 패턴 스캐너(qa_manager SECURITY_NETWORK_QA_STANDARD.md 이식) — 이 저장소는 Python 가드가 이미 있어 8개 규칙 전체 이식"
        test_items:
          - id: security-hotspots-guard
            category: basic
            description: "소스 파일에 CWE 매핑된 위험 패턴이 qa:allow 근거 주석 없이 남아있지 않은지 확인합니다. 직접 실행 기준(verify_repo.ps1 전체 체인이 아님 — 그 체인은 R1/R4의 기존 HANDOFF.md 위생 이슈로 이 항목 이전에 이미 실패함)."
            check: "python scripts/check_security_hotspots.py"
            status: pass
            last_verified: 2026-09-18
          - id: security-hotspots-guard-regression
            category: regression
            description: "규칙별 실탐/오탐 및 스캐너 자기제외가 의도대로 동작하는지 확인합니다."
            check: "python scripts/test_security_hotspots.py"
            status: pass
            last_verified: 2026-09-18
