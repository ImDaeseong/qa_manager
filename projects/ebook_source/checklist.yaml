requirements:
  - id: R1
    quality_dimension: functional_suitability
    description: 전체 배포본의 시스템·예제·템플릿·샘플 프로젝트가 실제 실행에서 통과한다.
    dev_items:
      - id: R1-D1
        description: ebook_source 공식 전체 배포 검증
        test_items:
          - id: distribution-full
            category: full
            description: 새 환경 재빌드까지 포함한 공식 배포 검증기를 실행한다.
            check: "python -B verify_distribution.py"
            status: pass
            last_verified: 2026-10-05
          - id: child-product-registry
            category: integration
            description: 저장소 안의 독립 제품을 로컬 qa_manager가 한 번씩 검수하고 누락을 거부한다.
            check: "python -B sample_project/qa_manager/scripts/run_registry.py --products-only"
            required_output: ["CHILD REGISTRY PASS"]
            status: pass
            last_verified: 2026-10-09
  - id: R2
    quality_dimension: maintainability
    description: 학습 자산과 공개 구조가 현재 파일 배치와 일치한다.
    dev_items:
      - id: R2-D1
        description: 학습 자산·문서 링크 계약
        test_items:
          - id: learning-assets
            category: regression
            description: 실행 예제, 템플릿, 샘플 프로젝트의 공개 계약을 검사한다.
            check: "python -B -m unittest -q test_learning_assets.py"
            status: pass
            last_verified: 2026-10-05
          - id: structure-links
            category: regression
            description: 배포 구조와 루트 문서의 로컬 링크를 검사한다.
            check: "python -B -c \"import verify_distribution as v; v.verify_structure(); v.verify_document_links(); print('PASS STRUCTURE_LINKS')\""
            status: pass
            last_verified: 2026-10-05
  - id: R3
    quality_dimension: security
    description: 공개 배포본이 로컬 절대 경로와 비공개 데이터 형태를 차단한다.
    dev_items:
      - id: R3-D1
        description: 휴대성·민감정보 가드
        test_items:
          - id: public-boundary
            category: security
            description: 알려진 비공개 경로 형태의 탐지와 정상 URL 허용을 검사한다.
            check: "python -B -c \"import verify_distribution as v; v.verify_guard(); print('PASS PUBLIC_BOUNDARY')\""
            status: pass
            last_verified: 2026-10-05
  - id: R4
    quality_dimension: compatibility
    description: 책과 동반 소스가 같은 경로·검증 명령·원고 반영 계약을 사용한다.
    dev_items:
      - id: R4-D1
        description: 형제 ebook 저장소와의 동기화 계약
        test_items:
          - id: companion-contract
            category: integration
            description: companion_contract.json의 약속 경로와 원고 반영 매핑을 검사한다.
            check: "python -B -c \"import verify_distribution as v; v.verify_companion_contract(); print('PASS COMPANION_CONTRACT')\""
            status: pass
            last_verified: 2026-10-05
