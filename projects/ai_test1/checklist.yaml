requirements:
  - id: R1
    quality_dimension: maintainability
    description: "안내 문서(README 등)에 적힌 '테스트 몇 개 통과'라는 숫자가, 실제 테스트 개수와 항상 일치해야 한다"
    dev_items:
      - id: R1-D1
        description: "문서-실제 개수 일치 검사 — 각 프로그램의 실제 테스트 개수를 세어 문서에 적힌 숫자와 비교, 설치 스크립트 문법과 문서 링크도 함께 확인"
        test_items:
          - id: repo-consistency-check
            category: full
            description: "안내 문서에 적힌 테스트 개수가 실제와 다르지 않은지, 설치 스크립트에 문법 오류가 없는지, 문서 안 링크가 깨지지 않았는지 확인합니다."
            check: "python -m pytest test_repository_consistency.py -q"
            status: pass
            last_verified: 2026-08-05

  - id: R2
