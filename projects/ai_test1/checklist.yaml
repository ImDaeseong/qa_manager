# Verification checklist for ai_test1 (independent repo, C:\Users\cs930\Desktop\ai_test1).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation.
#
# This repo has NO repo-wide CI or "run everything" script (confirmed: no
# .github/workflows/, setup_env.ps1 only sets up environment). The one
# root-level automated check, test_repository_consistency.py, is a
# doc-consistency check (asserts README/PROJECT_STATUS/per-project CLAUDE.md
# report the correct current test count) — not an aggregate test runner.
# Everything else is per-subproject pytest, listed below for every
# subdirectory confirmed to have conftest.py + pytest.ini + tests_unit.py.
# mov_img_skills is intentionally not listed: it has zero .py files (pure
# markdown prompt/workflow docs), so there is nothing to run pytest against.
# No ruff/mypy/pyright config exists anywhere in this repo (verified by
# direct grep, despite a prior assumption that pyright was configured here).

project: ai_test1
repo_root: ai_test1
updated: 2026-08-05

