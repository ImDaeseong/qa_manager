# Verification checklist for ai_prompt (independent repo, nested at
# hermes-agents/ai_prompt on this machine but unrelated to hermes-agents).
# See ../hermes-agents/checklist.yaml's header comment for the full schema
# explanation (requirements -> dev_items -> test_items, repo_root, etc.).
#
# Every item below is taken directly from .github/workflows/validate.yml and
# the scripts/*.ps1 it calls (confirmed by reading them, not guessed).

project: ai_prompt
repo_root: hermes-agents/ai_prompt
updated: 2026-08-05

requirements:
  - id: R1
    quality_dimension: functional_suitability
    description: "전체 자동 검사를 한꺼번에 실행해도 문제없이 통과해야 하고, 검사 과정 자체가 실수로 파일을 바꾸면 안 된다"
    dev_items:
      - id: R1-D1
        description: "통합 검사 실행기 — 아래 R2, R3의 검사를 순서대로 실행하고, 검사 전후로 파일이 바뀌지 않았는지 확인"
        test_items:
          - id: verify-repo-full
            category: full
            description: "스킬 문서 검사와 링크 검사를 순서대로 실행하고, 실행 전후로 저장소 파일이 의도치 않게 바뀌지 않았는지 함께 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/verify_repo.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R2
    quality_dimension: maintainability
    description: "스킬 설명 문서의 필수 정보와 문서 간 연결이 깨지지 않아야 한다"
    dev_items:
      - id: R2-D1
        description: "스킬 문서 형식 검사 — 이름/설명 누락이나 중복, 존재하지 않는 다른 스킬 문서 참조, 라이선스 문서 상호 연결 누락을 확인"
        test_items:
          - id: validate-skills-guard
            category: basic
            description: "각 스킬 설명 문서에 이름·설명이 빠짐없이 채워져 있고, 다른 스킬을 가리키는 링크가 실제로 존재하는 문서를 가리키는지 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/validate_skills.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R3
    quality_dimension: maintainability
    description: "문서 안의 내부 링크가 깨지지 않아야 한다"
    dev_items:
      - id: R3-D1
        description: "문서 내부 링크 검사 — 코드 예시 안의 텍스트는 제외하고 실제 링크만 대상 문서 존재 여부 확인"
        test_items:
          - id: validate-links-guard
            category: basic
            description: "문서 안에 있는 다른 문서로의 링크가 실제로 존재하는 파일을 가리키는지 확인합니다(코드 예시 안의 글자는 링크로 오인하지 않도록 제외)."
            check: "powershell.exe -NoProfile -File scripts/validate_links.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R4
    quality_dimension: portability
    description: "저장소를 새로 내려받았을 때 자동 검사 도구를 설치하는 스크립트가 과거 발견된 3가지 문제(다른 도구의 설정 덮어쓰기, 특정 폴더 구조에서만 동작, 폴더가 없을 때 오류)를 다시 일으키면 안 된다"
    dev_items:
      - id: R4-D1
        description: "설치 스크립트 회귀 검사 — 임시 저장소를 만들어 설치 스크립트를 실제로 실행해봄"
        test_items:
          - id: install-hooks-regression
            category: regression
            description: "자동 검사 도구를 설치하는 스크립트가 기존에 설정된 다른 도구를 덮어쓰지 않고, 폴더 구조가 다르거나 폴더가 아직 없어도 정상 동작하는지 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/test_install_git_hooks.ps1"
            status: pass
            last_verified: 2026-08-05

  - id: R5
    quality_dimension: reliability
    description: "검사 과정에서 파일이 실수로 바뀌었는지 감지하는 안전장치 자체가 실제로 작동해야 한다"
    dev_items:
      - id: R5-D1
        description: "안전장치 자가 점검 — 임시 저장소에 일부러 파일을 하나 만들어서, 그걸 실제로 잡아내는지 확인"
        test_items:
          - id: verify-repo-side-effect-selftest
            category: regression
            description: "검사 전후 파일 변경을 감지하는 안전장치가, 실제로 새 파일이 생기면 그걸 놓치지 않고 잡아내는지 자체 점검합니다."
            check: "powershell.exe -NoProfile -File scripts/verify_repo.ps1 -SideEffectSelfTest"
            status: pass
            last_verified: 2026-08-05

  # Added 2026-09-14 as part of raising this project toward AGENTS.md's
  # Commercial-Grade Baseline rule (secret scanning is partial security evidence;
  # it finds potential secrets in tracked files). hermes-agents already has this guard; ai_prompt did not.
  - id: R6
    quality_dimension: security
    description: "커밋되는 파일에 실제로 사용 가능한 비밀정보(API 키, 토큰)가 들어가면 안 된다"
    dev_items:
      - id: R6-D1
        description: "비밀정보처럼 보이는 값 패턴 검사 — hermes-agents의 동일 가드를 이식"
        test_items:
          - id: no-example-secrets-guard
            category: basic
            description: "저장소에 올라가는 파일에 실제로 사용 가능한 비밀번호나 인증키가 실수로 포함되지 않았는지 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/check_no_example_secrets.ps1"
            status: pass
            last_verified: 2026-09-14
      - id: R6-D2
        description: "패턴 목록이 실제로 심어둔 가짜 비밀키를 잡아내고, 평범한 문장에는 반응하지 않는지 검사"
        test_items:
          - id: no-example-secrets-guard-regression
            category: regression
            description: "비밀정보 탐지 패턴이 실제 가짜 비밀키 형태를 놓치지 않고, 평범한 텍스트를 오탐하지 않는지 확인합니다. 2026-09-18: 단일행 파일을 건너뛰던 실제 결함(Get-Content가 1줄 파일에서 배열 대신 문자열을 반환)을 발견·수정, 회귀 케이스 추가."
            check: "powershell.exe -NoProfile -File scripts/test_check_no_example_secrets.ps1"
            status: pass
            last_verified: 2026-09-18

  - id: R7
    quality_dimension: security
    description: "커밋되는 소스 코드에 OWASP/CWE 근거 기반 보안·해킹·네트워크 허점이 미검토 상태로 남으면 안 된다"
    dev_items:
      - id: R7-D1
        description: "정적 패턴 스캐너(PowerShell 이식, qa_manager SECURITY_NETWORK_QA_STANDARD.md 기준) — 이 저장소에 해당 없는 SQL/pickle/eval 규칙은 제외"
        test_items:
          - id: security-hotspots-guard
            category: basic
            description: "소스 파일에 CWE 매핑된 위험 패턴(하드코딩 자격증명, Invoke-Expression, TLS검증비활성화, 평문http, CORS전체허용)이 qa:allow 근거 주석 없이 남아있지 않은지 확인합니다."
            check: "powershell.exe -NoProfile -File scripts/check_security_hotspots.ps1"
            status: pass
            last_verified: 2026-09-18
          - id: security-hotspots-guard-regression
            category: regression
            description: "규칙별 실탐/오탐 및 스캐너 자기제외가 의도대로 동작하는지 확인합니다. 작성 중 실제 결함(단일행 파일 스캔 누락, R6-D2와 동일 원인) 발견·수정."
            check: "powershell.exe -NoProfile -File scripts/test_check_security_hotspots.ps1"
            status: pass
            last_verified: 2026-09-18
