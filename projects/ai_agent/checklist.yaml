requirements:
  - id: R1
    quality_dimension: maintainability
    description: "문서 링크와 첫 프로젝트 계약(SPEC/plan/todo)이 서로 일관되어야 한다 — 깨진 링크나 삭제된 ResearchAgent 전용 문구가 남아있으면 안 된다"
    dev_items:
      - id: R1-D1
        description: "scripts/validate_docs.ps1 — 마크다운 링크 검사 + 문서 계약 검증"
        test_items:
          - id: validate-docs
            category: full
            description: "저장소 전체 .md 링크와 SPEC/plan/todo/ARCHITECTURE/ROADMAP/SECURITY_BOUNDARY의 프로젝트-중립 계약을 검증합니다."
            check: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate_docs.ps1"
            status: pass
            last_verified: 2026-09-10

  - id: R2
    quality_dimension: functional_suitability
    description: "evals/ 부트스트랩 평가 스위트가 스키마(case.schema.json)를 통과해야 한다"
    dev_items:
      - id: R2-D1
        description: "scripts/validate_evals.py — JSON Schema 검증 로직과 그 자체 테스트"
        test_items:
          - id: validate-evals-tests
            category: basic
            description: "validate_suite()의 정상/스키마위반/교차필드제약 케이스를 검증합니다."
            check: "python -m pytest tests/test_validate_evals.py -q"
            status: pass
            last_verified: 2026-09-10

  - id: R3
    quality_dimension: functional_suitability
    description: "api/ 공공데이터 클라이언트 라이브러리(기상청·국토교통부·우정사업본부·서울교통공사·카카오·텔레그램·왓츠앱)의 각 모듈이 자체 테스트를 통과해야 한다 — 외부 호출은 모킹되어 인증키 불필요"
    dev_items:
      - id: R3-D1
        description: "kma_asos_hourly — 종관기상관측 시간자료 클라이언트"
        test_items:
          - id: asos-client-tests
            category: basic
            description: "이 모듈에 포함된 자체 테스트가 정상적으로 통과하는지 확인합니다."
            check: "cd api && python -m unittest tests.test_asos_client -q"
            status: pass
            last_verified: 2026-09-10
      - id: R3-D2
        description: "molit_bus_stop — 국토교통부 버스정류소 클라이언트"
