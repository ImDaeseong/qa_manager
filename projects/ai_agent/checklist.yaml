  - id: R4
    quality_dimension: security
    description: "커밋되는 소스 코드에 OWASP/CWE 근거 기반 보안·해킹·네트워크 허점이 미검토 상태로 남으면 안 된다"
    dev_items:
      - id: R4-D1
        description: "정적 패턴 스캐너(qa_manager SECURITY_NETWORK_QA_STANDARD.md 이식)"
        test_items:
          - id: security-hotspots-guard
            category: basic
            description: "소스 파일에 CWE 매핑된 위험 패턴이 qa:allow 근거 주석 없이 남아있지 않은지 확인합니다. 3건의 공공데이터 http 엔드포인트는 SECURITY_BOUNDARY.md의 평문 예외 근거로, masters-panel-agent의 쿠키 이름 상수·테스트 픽스처 2건은 CWE-798 오탐으로 qa:allow 처리했습니다."
            check: "python scripts/check_security_hotspots.py"
            status: pass
            last_verified: 2026-09-22
          - id: security-hotspots-guard-regression
            category: regression
            description: "규칙별 실탐/오탐 및 스캐너 자기제외가 의도대로 동작하는지 확인합니다."
            check: "python -m pytest tests/test_security_hotspots.py -q"
            status: pass
            last_verified: 2026-09-22

  - id: R5
    quality_dimension: functional_suitability
    description: "경제 조사 앱의 주장·검색·출처 대조 자동 회귀 검사가 통과해야 한다. 실제 유료 검색과 판단 품질은 별도 HOLD다."
    dev_items:
      - id: R5-D1
        description: "economic-research-assistant 테스트"
        test_items:
          - id: economic-research-tests
            category: full
            description: "경제 조사 앱의 서버·저장소·출처 대조 회귀 검사를 실행합니다."
            check: "cd projects\\economic-research-assistant && python -m pytest tests -q -p no:cacheprovider"
            status: pass
            last_verified: 2026-09-22

