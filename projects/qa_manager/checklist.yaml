project: qa_manager
repo_root: qa_manager
release_review:
  release: "2026-09-20-rc1"
  audience: "전세계 개발자·QA 담당자 (운영 기본값; 출시 책임자 확인 대기)"
  distribution: "GitHub Pages 대시보드와 GitHub 소스코드의 무료 공개"
  jurisdictions: ["전세계"]
  approval:
    reviewer: "ImDaeseong"
  areas:
    functional_suitability: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#기능-적합성"}
    performance_efficiency: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#성능-효율성"}
    compatibility: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#호환성"}
    interaction_capability: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#상호작용-능력"}
    reliability: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#신뢰성"}
    security: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#보안"}
    maintainability: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#유지보수성"}
    portability: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#유연성-이식성"}
    safety: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#안전성"}
    quality_in_use: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#실사용-품질"}
    privacy: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#개인정보-데이터-거버넌스"}
    supply_chain: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#공급망-라이선스"}
    operations: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#배포-운영"}
    legal: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#법률-규제"}
    commercial: {decision: pending, evidence: "QA_MANAGER_RELEASE_REVIEW.md#사업-운영"}
acceptance_reviews:
  feature:
    - id: QA-FEATURE-1
      title: Generate a project dashboard from a registered checklist
      role: QA operator
      preconditions: A reviewed checklist and its repository are available
      steps:
        - Run the project dashboard generator
        - Open the generated dashboard
        - Confirm technical and acceptance gates remain separate
      expected_result: The current checks and product acceptance status are both visible
      actual_result: The generator completed with 9 requirements, 16 test items, and 0 failures
      evidence: evidence/qa_manager-acceptance/ACCEPTANCE.md#feature-review
      reviewer: Codex execution review
      reviewed_at: 2026-10-09
      status: pass
  ui:
    - id: QA-UI-1
      title: Review the dashboard's primary interaction states
      role: QA operator
      preconditions: A current dashboard has been generated
      steps:
        - Open the dashboard in a supported browser
        - Expand requirements and acceptance sections
        - Check keyboard focus and narrow viewport readability
      expected_result: All controls, states, and evidence remain readable and operable
      actual_result: Desktop rendering passed; mobile overflow was repaired, but the post-fix capture retained an unexplained viewport offset
      evidence: evidence/qa_manager-acceptance/ACCEPTANCE.md#ui-review
      reviewer: Codex visual review
      reviewed_at: 2026-10-09
      status: blocked
  workflow:
    - id: QA-WORKFLOW-1
      title: Complete the checklist-to-release-review workflow
      role: Release reviewer
      preconditions: Technical checks and acceptance cases are registered
      steps:
        - Run the registered technical checks
        - Record feature and UI observations
        - Review evidence and make the release decision
      expected_result: Technical PASS cannot produce product approval without acceptance evidence
      actual_result: Technical PASS remained separate from product acceptance and the UI BLOCKED result kept the product gate on HOLD
      evidence: evidence/qa_manager-acceptance/ACCEPTANCE.md#workflow-review
      reviewer: Codex workflow review
      reviewed_at: 2026-10-09
      status: pass

requirements:
  - id: R1
    description: 검수 실행기는 프로젝트 경계와 비밀정보를 보호한다.
    quality_dimension: security
    dev_items:
      - id: R1-D1
        description: 경로·환경·출력·명령 입력 보안 경계
        test_items:
          - id: R1-D1-T1
            category: regression
            description: 경로 탈출, 비밀 환경변수, 출력 마스킹, 다중 행 명령을 자동 검증한다.
            check: "python -m unittest tests.test_security tests.test_run_checklist tests.test_project_inventory -q"
            status: pass
  - id: R2
    description: LLM 검수 기준과 프로젝트 구조 문서가 실행 코드와 함께 유지된다.
    quality_dimension: maintainability
    dev_items:
      - id: R2-D1
        description: 근거 기반 LLM 위험 기준 및 구조 문서
        test_items:
          - id: R2-D1-T1
            category: basic
            description: 필수 문서와 핵심 검수 용어가 존재하는지 확인한다.
            check: "python scripts/check_required_docs.py"
            status: pass
  - id: R3
    description: 등록 프로젝트의 보안·해킹·네트워크 허점을 근거 기반 기준으로 탐지한다.
    quality_dimension: security
    dev_items:
      - id: R3-D1
        description: OWASP/CWE/NIST 근거 기반 정적 패턴 스캐너
        test_items:
          - id: R3-D1-T1
            category: regression
            description: 하드코딩된 자격증명, 명령/SQL 삽입, TLS 검증 비활성화, 평문 http, CORS 전체허용 패턴을 자동 검증한다.
            check: "python -m unittest tests.test_security_hotspots -q"
            status: pass
          - id: R3-D1-T2
            category: basic
            description: qa_manager 자체 코드에 미검토(qa:allow 미표기) 보안/네트워크 허점이 없는지 확인한다.
            check: "python scripts/check_security_hotspots.py ."
            status: pass
          - id: R3-D1-T3
            category: regression
            description: SECURITY_NETWORK_QA_STANDARD.md의 CWE/OWASP 근거가 1년 넘게 재검토 없이 방치되지 않았는지 확인한다.
            check: "python scripts/check_security_standard_freshness.py"
            status: pass
            last_verified: 2026-09-18
          - id: R3-D1-T4
            category: regression
            description: 모든 qa:allow 억제 주석이 CWE 번호와 실제 사유를 갖추고 있는지 감사한다(무근거 억제 방지).
            check: "python scripts/check_qa_allow_audit.py"
            status: pass
          - id: R3-D1-T5
            category: regression
            description: 노출면·가용성 스캐너(0.0.0.0 바인딩, 요청 바디 크기 상한, 속도 제한)의 실탐/오탐을 자동 검증한다.
            check: "python -m unittest tests.test_exposure_hotspots -q"
            status: pass
            last_verified: 2026-10-24
          - id: R3-D1-T6
            category: basic
            description: qa_manager 자체 코드에 미검토 노출면/가용성 허점이 없는지 확인한다.
            check: "python scripts/check_exposure_hotspots.py ."
            status: pass
            last_verified: 2026-10-24
          - id: R3-D1-T7
            category: regression
            description: 새 프로젝트 시작용 체크리스트 생성기가 노출 검사를 기본 등록하고 덮어쓰기·경로 이탈·잘못된 이름을 거부하는지 확인한다.
            check: "python -m unittest tests.test_new_project -q"
            status: pass
            last_verified: 2026-10-24
          - id: R3-D1-T8
            category: regression
            description: 보안 구현 조각(속도 제한기, 본문 상한 읽기, 바인딩 옵트인)이 동작하고 자신의 두 스캐너를 통과하는지 확인한다.
            check: "python -m unittest tests.test_security_templates -q"
            status: pass
            last_verified: 2026-10-24
          - id: R3-D1-T9
            category: regression
            description: 운영 준비도 스캐너(브라우저 노출 비밀값, 과한 DB 권한, 테스트 없는 핵심 기능, T2 알림·백업 흔적)의 실탐/오탐을 자동 검증한다(OPERATIONS_QA_STANDARD.md).
            check: "python -m unittest tests.test_operational_readiness -q"
            status: pass
            last_verified: 2026-10-25
          - id: R3-D1-T10
            category: basic
            description: qa_manager 자체 코드에 미검토 운영 준비도 허점이 없는지 확인한다.
            check: "python scripts/check_operational_readiness.py ."
            status: pass
            last_verified: 2026-10-25

  # Added 2026-09-20 as part of applying the commercial-readiness rollup
  # (see quality_dimension header comment in ../hermes-agents/checklist.yaml)
  # to qa_manager itself: reliability was a real, previously-untested gap --
  # run_test_item()'s Windows process-tree-kill fix (its own docstring
  # documents the bug it works around) had no test proving it actually works.
  - id: R4
    description: 검사 명령이 멈춰도(hang) 전체 재검사가 무기한 블로킹되지 않고, 시간 초과로 실패 처리되며 프로세스 트리가 실제로 종료된다.
    quality_dimension: reliability
    dev_items:
      - id: R4-D1
        description: run_test_item()의 타임아웃+프로세스 트리 강제 종료 로직
        test_items:
          - id: R4-D1-T1
            category: regression
            description: 타임아웃보다 훨씬 오래 걸리는 명령을 실행시켜, 실제로 그 시간 안에 종료 처리되고 TIMEOUT으로 보고되는지 확인한다(강제 종료가 안 되면 자식 프로세스가 끝날 때까지 그대로 블로킹된다).
            check: "python -m pytest tests/test_reliability.py -q"
            status: pass
            last_verified: 2026-09-20
      - id: R4-D2
        description: 공개 결과 파일을 완성한 뒤 교체하고 실패 시 이전 결과를 보존한다.
        test_items:
          - id: R4-D2-T1
            category: regression
            description: 결과 교체 실패를 주입하여 기존 보고서 내용과 임시 파일 정리를 검증한다.
            check: "python -m unittest tests.test_public_report.PublicReportTests.test_replace_failure_preserves_previous_report_and_removes_temp -q"
            status: pass
            last_verified: 2026-09-24

  - id: R5
    description: 프로젝트 검사 결과가 개별 대시보드와 전체 색인에 같은 실시간 판정으로 반영된다.
    quality_dimension: functional_suitability
    dev_items:
      - id: R5-D1
        description: 등록부터 검사 실행과 두 HTML 결과 생성까지 종단 검증
        test_items:
          - id: R5-D1-T1
            category: regression
            description: 저장된 pass 표시와 달리 실제 검사 실패 시 두 화면이 실패로 바뀌는지 검증한다.
            check: "python -m unittest tests.test_public_report.PublicReportTests.test_checklist_to_dashboard_and_index_uses_live_result -q"
            status: pass
            last_verified: 2026-09-24

  - id: R6
    description: 공개 HTML의 민감 정보와 미검토 프로젝트의 자동 게시를 차단한다.
    quality_dimension: privacy
    dev_items:
      - id: R6-D1
        description: 보고서 공개 전 민감 정보 차단
        test_items:
          - id: R6-D1-T1
            category: regression
            description: 로컬 사용자 경로와 토큰 형태의 값을 거부하며 기존 파일을 보존하는지 검증한다.
            check: "python -m unittest tests.test_public_report.PublicReportTests.test_private_content_is_rejected_without_replacing_existing_report -q"
            status: pass
            last_verified: 2026-09-24
      - id: R6-D2
        description: 새 프로젝트의 공개 적합성 검토 경계
        test_items:
          - id: R6-D2-T1
            category: regression
            description: 미검토 프로젝트가 두 공개 보고서를 교체하지 못하는지 검증한다.
            check: "python -m unittest tests.test_public_report.PublicReportTests.test_unreviewed_project_cannot_replace_public_reports -q"
            status: pass
            last_verified: 2026-09-24
      - id: R6-D3
        description: 공개 문서와 보고서의 로컬 계정 경로 검사
        test_items:
          - id: R6-D3-T1
            category: basic
            description: 공개 파일에 로컬 계정 경로가 남아 있지 않은지 검사한다.
            check: "python scripts/check_public_paths.py"
            status: pass
            last_verified: 2026-09-24
          - id: R6-D3-T2
            category: regression
            description: Windows·Unix 계정 경로 탐지와 상대 경로 허용을 검증한다.
            check: "python -m unittest tests.test_check_public_paths -q"
            status: pass
            last_verified: 2026-09-24

  - id: R7
    description: 문서에 나온 상대 경로 명령으로 프로젝트 대시보드를 생성할 수 있다.
    quality_dimension: portability
    dev_items:
      - id: R7-D1
        description: 현재 작업 디렉터리 기준 체크리스트 경로 처리
        test_items:
          - id: R7-D1-T1
            category: regression
            description: qa_manager 루트에서 상대 경로 체크리스트를 넘겨 HTML이 생성되는지 검증한다.
            check: "python -m unittest tests.test_public_report.PublicReportTests.test_relative_checklist_path_from_readme_runs -q"
            status: pass
            last_verified: 2026-09-24

  - id: R8
    description: 밝은·어두운 테마의 일반 텍스트 색상 대비가 WCAG AA 기준 이상이다.
    quality_dimension: interaction_capability
    dev_items:
      - id: R8-D1
        description: 생성 페이지의 공통 텍스트·배지 색상 대비
        test_items:
          - id: R8-D1-T1
            category: regression
            description: 두 테마의 본문·링크·상태 배지 텍스트가 4.5:1 이상인지 검증한다.
            check: "python -m unittest tests.test_style_contrast -q"
            status: pass
            last_verified: 2026-09-24

  - id: R9
    description: 검사 실패는 무제한 재시도하지 않고 수정 증거를 이월하며 PASS 또는 HOLD로 끝난다.
    quality_dimension: reliability
    dev_items:
      - id: R9-D1
        description: Hermes 수정 루프의 반복 제한·상태 기록·사람 승인 경계
        test_items:
          - id: R9-D1-T1
            category: regression
            description: 무변경 재시도 1회, 최대 3회, 동일 위치 수정 실패와 고위험 HOLD 판정을 검증한다.
            check: "python -m unittest tests.test_verification_loop -q"
            status: pass
  - id: R10
    quality_dimension: reliability
    description: "넓은 예외(bare except·Exception·catch)를 잡고도 아무 조치를 하지 않는 오류 핸들러, 핸들러 안의 TODO/FIXME가 사유 없이 남으면 안 된다(오류 처리 코드는 마지막 방어선: Yuan 등 OSDI 2014)"
    dev_items:
      - id: R10-D1
        description: "오류 처리 정적 패턴 스캐너(qa_manager/scripts/check_error_handling_hotspots.py)"
        test_items:
          - id: error-handling-hotspots-guard
            category: basic
            description: "CWE-390/CWE-755 패턴이 qa:allow 사유 없이 남아있지 않은지 확인합니다. 정적 패턴만 보며 삼키는 것이 옳은지는 판단하지 못하고 사유가 적혀 있는지만 봅니다."
            check: "python ../qa_manager/scripts/check_error_handling_hotspots.py ."
            status: pass
            last_verified: 2026-10-24
          - id: error-handling-scanner-tests
            category: regression
            description: 오류 처리 스캐너의 실탐/오탐, 사유 인정, 외부 코드 제외, 등록 누락 방지를 자동 검증한다.
            check: "python -m unittest tests.test_error_handling_hotspots -q"
            status: pass
            last_verified: 2026-10-24
          - id: boundary-errors-template-tests
            category: regression
            description: 경계 오류 기록 템플릿(분류, 원인 사슬, 한 번만 기록, 데이터 계약 검증)과 세 스캐너 통과를 자동 검증한다.
            check: "python -m unittest tests.test_boundary_errors -q"
            status: pass
            last_verified: 2026-10-24
