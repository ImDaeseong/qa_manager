name: Validate qa_manager

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run qa_manager's own regression test suite
        run: python -m unittest discover -s tests -q
      - name: Verify required architecture/LLM-QA documents exist
        run: python scripts/check_required_docs.py
      - name: Self-scan for security/network hotspots
        run: python scripts/check_security_hotspots.py .
      - name: Check CWE/OWASP citation freshness
        run: python scripts/check_security_standard_freshness.py
      - name: Audit qa:allow suppressions
        run: python scripts/check_qa_allow_audit.py
      - name: Reject local account paths in public files
        run: python scripts/check_public_paths.py
